<title>The Founder's Dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one walkable scene (canvas) with a slim HUD above and an action bar below.
   Reading, planning and the casebook open as sheets over the scene. Single deliberate dark look. */
:root{
  color-scheme: dark;
  --ink:#121826; --ink-2:#1b2335; --ink-3:#26304a; --line:#34405e;
  --gilt:#d4a94e; --gilt-soft:#8f7642; --rubric:#c8553d; --verdure:#7fae8a;
  --vellum:#efe4cc; --vellum-ink:#2b2418; --text:#e3e6ee; --muted:#9aa3b8;
  --f-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-book:"IM Fell English",Georgia,"Times New Roman",serif;
  --f-ui:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(1.5rem,3.4vw,2.2rem);color:var(--gilt);line-height:1.1}
h2{font-size:1.4rem;color:var(--gilt)}
h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--gilt);color:var(--ink);border:0;border-radius:3px;padding:10px 18px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{background:var(--ink-3);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gilt);border:1px solid var(--gilt-soft)}
.btn.small{padding:6px 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hud .where{font-family:var(--f-book);font-style:italic;color:var(--muted)}
.meter{display:flex;gap:5px;align-items:center}
.meter i{width:18px;height:7px;border-radius:1px;background:var(--rubric);display:block}
.meter i.ok{background:var(--verdure)}
.strip{background:var(--vellum);color:var(--vellum-ink);font-family:var(--f-book);font-size:1.02rem;line-height:1.45;padding:10px 16px;border-radius:2px;
  clip-path:polygon(0 8%,4% 0,30% 4%,52% 0,78% 5%,100% 0,99% 50%,100% 100%,70% 95%,44% 100%,18% 94%,0 100%,1% 50%)}
.strip b{font-weight:400;background:rgba(200,85,61,.2)}
.strip.saved{background:#dfe8d6}

.stage{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#000}
canvas{display:block;width:100%;touch-action:none}
.dialog{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(18,24,38,.94);border:1px solid var(--gilt-soft);border-radius:4px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.dialog .who{font-family:var(--f-display);color:var(--gilt);font-size:1.05rem}
.dialog .say{font-family:var(--f-book);font-size:1.1rem;line-height:1.45}
.dialog .more{font-size:.78rem;color:var(--muted);align-self:flex-end}
.actionbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.act{min-height:44px}
.help{font-size:.85rem;color:var(--muted)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,10,18,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:3px;padding:4px 10px;flex:none}
.page{background:var(--vellum);color:var(--vellum-ink);max-width:620px;width:100%;max-height:86vh;overflow:auto;border-radius:2px;padding:28px 30px;font-family:var(--f-book);font-size:1.12rem;line-height:1.6;display:flex;flex-direction:column;gap:12px}
.page h3{font-family:var(--f-display);font-size:1.35rem}
.page .by{font-style:italic;color:#6a5c45}
.page .close{align-self:flex-end;font-family:var(--f-ui);background:var(--vellum-ink);color:var(--vellum);border:0;border-radius:3px;padding:6px 14px}
.page p+p{text-indent:1.2em}
.shelf{display:flex;flex-direction:column;gap:8px}
.book{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--text);width:100%}
.book:hover{border-color:var(--gilt-soft)}
.book .spine{flex:none;width:8px;align-self:stretch;border-radius:1px;background:var(--gilt-soft)}
.book.k-diary .spine{background:#6f8fb8} .book.k-letter .spine{background:#9c7fb0} .book.k-report .spine{background:var(--rubric)} .book.k-record .spine{background:#8a9479}
.book .t{font-family:var(--f-book);font-size:1.05rem;line-height:1.3}
.book .m{font-size:.8rem;color:var(--muted)}
.book .new{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--gilt);border-radius:2px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.book.read .t{color:#c9cdd8}
.empty{font-family:var(--f-book);font-style:italic;color:var(--muted)}
.ashes{color:var(--rubric);font-family:var(--f-book);font-style:italic}
.fragment{background:var(--vellum);color:var(--vellum-ink);font-family:var(--f-book);font-size:1.2rem;line-height:1.55;padding:18px 22px;border-radius:2px}
.fragment b{font-weight:400;background:rgba(200,85,61,.2)}
.travel{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.trip{background:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text)}
.trip:hover:not([disabled]){border-color:var(--gilt)}
.trip[disabled]{opacity:.5;cursor:not-allowed}
.trip .yr{font-family:var(--f-display);color:var(--gilt);font-size:1.6rem;line-height:1}
.trip .role{font-size:.85rem;color:var(--muted)}
.flag{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.flag.bad{color:var(--rubric)} .flag.ok{color:var(--verdure)}
.log{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.log .entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem;padding:6px 8px;border-radius:3px;background:var(--ink-3)}
.log .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.log .what{min-width:0;overflow-wrap:anywhere}
.log button{background:none;border:1px solid var(--line);color:var(--gilt);border-radius:3px;padding:2px 8px;font-size:.8rem}
textarea{width:100%;min-height:110px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:10px;font:inherit;font-size:.92rem;resize:vertical}
.hint{font-family:var(--f-book);font-size:1.02rem;border-left:2px solid var(--gilt-soft);padding-left:10px}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rule{background:var(--ink-3);border-radius:3px;padding:10px 12px;font-size:.92rem}
.rule b{color:var(--gilt);font-weight:500}
.table{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:26px 12px 14px;background:linear-gradient(#3a2a1c,#2e2116);border-radius:6px;border:1px solid #5a4330}
.table::before{content:"head of table";position:absolute;left:12px;top:6px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#b49a78}
@media (max-width:700px){.table{grid-template-columns:minmax(0,1fr)}}
.seat{background:var(--vellum);color:var(--vellum-ink);border:2px solid transparent;border-radius:3px;padding:8px 6px;min-height:84px;display:flex;flex-direction:column;gap:2px;text-align:center;justify-content:center;font-family:var(--f-book);width:100%}
.seat .no{font-family:var(--f-ui);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#7b6a4c}
.seat .nm{font-size:1.04rem;line-height:1.2}
.seat .ds{font-family:var(--f-ui);font-size:.74rem;color:#6a5c45}
.seat.sel,.cell.sel{border-color:var(--gilt);box-shadow:0 0 0 3px rgba(212,169,78,.35)}
.seat.fixed{cursor:not-allowed;background:#e2d6b9}
.talks{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip.intro{border-style:dashed;border-color:var(--gilt-soft)}
.prog{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px}
.prog .h{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:end}
.prog .sess{font-family:var(--f-display);color:var(--gilt);align-self:center;padding-right:6px}
.cell{background:var(--vellum);color:var(--vellum-ink);border:2px solid transparent;border-radius:3px;padding:10px;text-align:left;font-family:var(--f-book);width:100%;display:flex;flex-direction:column;gap:2px}
.cell .tk{font-style:italic;font-size:.9rem;color:#5c4f3a}
.warn{color:var(--rubric);font-size:.92rem}
.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.letter{background:var(--ink-3);border-radius:3px;padding:10px 12px;font-family:var(--f-book)}
.letter .who{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gilt)}
.interlude{display:flex;flex-direction:column;gap:12px;font-family:var(--f-book);font-size:1.12rem}
.interlude .ev{border-left:2px solid var(--line);padding-left:12px}
.title-screen{min-height:70vh;display:flex;flex-direction:column;gap:18px;justify-content:center;max-width:70ch;margin:0 auto}
.title-screen h1{font-size:clamp(2.4rem,7vw,4rem)}
.title-screen .lede{font-family:var(--f-book);font-size:1.25rem}
</style>

<div class="wrap" id="app"></div>

<script id="logic">
// ===== Game logic: data, rules and simulation. No drawing here. =====
// tools/check-puzzles.js runs this script on its own to prove the puzzles can be solved.
(function(){
const P = {
  A:{name:"Prof. Ashworth", full:"Professor Hugh Ashworth", desc:"Master of the college"},
  B:{name:"Dr Bell", full:"Dr Lionel Bell", desc:"natural philosopher"},
  C:{name:"Rev. Carrow", full:"The Rev. Silas Carrow", desc:"vicar of St Ebbe's"},
  D:{name:"Mr Dunmore", full:"Mr Walter Dunmore", desc:"engineer, Swindon works"},
  E:{name:"Mrs Ellery", full:"Mrs Augusta Ellery", desc:"hostess and widow"},
  F:{name:"Miss Fenwick", full:"Miss Ada Fenwick", desc:"binder, Bodleian bindery"},
  H:{name:"Dr Hale", full:"Dr Edmund Hale", desc:"astronomer", talk:"The Great Comet of 1887"},
  Q:{name:"Miss Quill", full:"Miss Harriet Quill", desc:"geologist", talk:"Meteorites of the Mendips"},
  R:{name:"Mr Rao", full:"Mr Vikram Rao", desc:"mathematician", talk:"On Calculating Machines"},
  Pl:{name:"Lady Pell", full:"Lady Constance Pell", desc:"botanist", talk:"The Heating of Glasshouses"}
};
P.C.talk="Design in the Natural World"; P.D.talk="A Compact Steam Engine (with demonstration)";
const ROOMS = [
  {id:"clar", name:"Clarendon Building"},
  {id:"duke", name:"Duke Humfrey's Library"},
  {id:"div",  name:"Divinity School"},
  {id:"tower",name:"Old Schools Quadrangle"},
  {id:"rad",  name:"Radcliffe Camera"}
];
const ROOMNAME = Object.fromEntries(ROOMS.map(r=>[r.id,r.name]));
const HAZ = {
  dinner:{"C-D":"ALL","B-D":"rad","A-D":"tower","E-F":"duke"},
  bath:{"C-D":"ALL","D-Pl":"div","Pl-Q":"clar"}
};
// who each Bath speaker is keen to hear, in no particular order
const KEEN = {C:["D","H"], D:["R","Pl"], H:["Q"], Q:["D","H"], R:["Pl","Q"], Pl:["H","Q"]};
const HIST_SEATS = ["A","B","E","C","D","F"];
// schedule cells: [Morning Ball, Morning Octagon, Afternoon Ball, Afternoon Octagon, Evening Ball, Evening Octagon]
const HIST_SCHED = ["Q","H","D","R","Pl","C"];
const SESS = ["Morning","Afternoon","Evening"];

const key=(a,b)=>[a,b].sort().join("-");
const has=(set,a,b)=>set.has(key(a,b));

// ---------- simulation ----------
function dinnerMeet(s){
  const m=new Map();
  for(let i=0;i<5;i++) m.set(key(s[i],s[i+1]),"neighbours");
  const e=s.indexOf("E");
  if(e>0&&e<5){const k=key(s[e-1],s[e+1]); if(!m.has(k)) m.set(k,"introduced by Mrs Ellery");}
  return m;
}
function bathMeet(c){
  const m=new Map(); const where=[];
  for(let s=0;s<3;s++){
    const ball=c[2*s], oct=c[2*s+1], pump=[], w={ball,oct,toBall:[],toOct:[],pump};
    for(const x of c){
      if(x===ball||x===oct) continue;
      if(KEEN[x].includes(ball)){w.toBall.push(x); if(!m.has(key(x,ball))) m.set(key(x,ball),SESS[s].toLowerCase()+" talk");}
      else if(KEEN[x].includes(oct)){w.toOct.push(x); if(!m.has(key(x,oct))) m.set(key(x,oct),SESS[s].toLowerCase()+" talk");}
      else pump.push(x);
    }
    for(let i=0;i<pump.length;i++)for(let j=i+1;j<pump.length;j++){const k=key(pump[i],pump[j]); if(!m.has(k)) m.set(k,"Pump Room, "+SESS[s].toLowerCase());}
    where.push(w);
  }
  return {m,where};
}
function simulate(st){
  const dm=dinnerMeet(st.seats);
  const dinnerEngine=dm.has("C-D");
  const bm = (!dinnerEngine) ? bathMeet(st.sched).m : new Map();
  const engine = dinnerEngine ? "dinner" : (bm.has("C-D") ? "bath" : null);
  const lost=new Set(), cause={};
  for(const [k] of dm){const h=HAZ.dinner[k]; if(h&&h!=="ALL"){lost.add(h);cause[h]="dinner";}}
  for(const [k] of bm){const h=HAZ.bath[k]; if(h&&h!=="ALL"){lost.add(h);cause[h]="bath";}}
  return {dm,bm,engine,lost,cause,bathOpen:!dinnerEngine};
}

// ---------- the books ----------
// where: room id or "archive" (college archive: private papers survive everything)
// ruin: true if it survives even when the whole library is destroyed
const ITEMS = [
  {id:"menu",kind:"record",where:"archive",ruin:true,title:"Founder's Dinner, 1887: menu and places",by:"College kitchen",
   when:()=>true,text:[
   "Twelfth of November, 1887. Clear soup. Turbot. Saddle of mutton. Founder's pudding. Stilton.",
   "At the Master's table, one long side, six places: Prof. Hugh Ashworth (the Master), Dr Lionel Bell, the Rev. Silas Carrow, Mr Walter Dunmore, Mrs Augusta Ellery, Miss Ada Fenwick."]},
  {id:"pruett",kind:"record",where:"archive",ruin:true,title:"Mrs Pruett's kitchen book",by:"Mrs Pruett, cook-housekeeper",
   when:()=>true,text:[
   "The Master sits at the head, always, in the first place. Do not argue with him about it.",
   "At that table they talk to whoever is beside them and nobody else. The table is too long and the Master too loud.",
   "Mind where you put Mrs Ellery. She introduces whoever sits on her left to whoever sits on her right, every single time, and by the Stilton they are thick as thieves."]},
  {id:"register",kind:"record",where:"archive",ruin:true,title:"College register of guests, 1887",by:"The Bursar",
   when:()=>true,text:[
   "Ashworth, Prof. H. Master. Classicist. Forever wanting to modernise the library.",
   "Bell, Dr L. Natural philosopher. Writes on heating and ventilation.",
   "Carrow, Rev. S. Vicar of St Ebbe's. Keeps a workshop behind the vicarage; the neighbours complain of smoke.",
   "Dunmore, Mr W. Engineer, from the Great Western works at Swindon. A guest of the Master.",
   "Ellery, Mrs A. Widow. Knows everyone, and insists that everyone know everyone else.",
   "Fenwick, Miss A. Binder at the Bodleian bindery."]},

  // ---- dinner pairs ----
  {id:"lowe1",kind:"diary",where:"archive",ruin:true,title:"Diary of James Lowe, 13 Nov 1887",by:"James Lowe, undergraduate",
   when:c=>c.dm.has("C-D"),text:[
   "Waited at the Master's table for my shilling. The clergyman and the engineer scribbled on napkins together all through pudding. Something about an engine that could ‘clear a room of paper in a minute’.",
   "The engineer said he had come to Oxford on purpose to find a man like that. I did not care for the way they laughed."]},
  {id:"radfire",kind:"report",where:"archive",ruin:false,title:"Inquiry into the Radcliffe Camera Fire, 1903",by:"Curators of the Bodleian",
   when:c=>c.dm.has("B-D"),text:[
   "The fire began in the basement heating plant, a novel steam system designed jointly by Dr Lionel Bell and Mr Walter Dunmore.",
   "Both men told the committee they first sketched the system on the tablecloth as neighbours at the Founder's Dinner of 1887. The dome and the upper gallery were lost."]},
  {id:"towerfall",kind:"report",where:"archive",ruin:false,title:"The Fall of the Tower of the Five Orders, 1899",by:"Oxford Architectural Society",
   when:c=>c.dm.has("A-D"),text:[
   "The Master, Prof. Ashworth, long wished to raise books to the upper floors by machine. After a long conversation with Mr Dunmore at the Founder's Dinner he commissioned a steam book-lift inside the Tower.",
   "In March 1899 the lift's counterweights tore through the stair. The Tower and the east range of the Old Schools Quadrangle came down with it."]},
  {id:"dukerot",kind:"report",where:"archive",ruin:false,title:"Survey of Duke Humfrey's Library, 1912",by:"Keeper of Western Manuscripts",
   when:c=>c.dm.has("E-F"),text:[
   "Miss Ada Fenwick, the library's only skilled binder, left Oxford in 1888 to become Mrs Ellery's companion in London. The two had been seated together at the Founder's Dinner and were inseparable after.",
   "No binder replaced her. Damp and mould have taken the medieval bindings, and the library is closed to readers."]},
  {id:"memoir",kind:"book",where:"duke",title:"Fifty Years at High Table (1902)",by:"Hugh Ashworth",
   when:c=>c.dm.has("A-E"),text:["Dedication: To Mrs Augusta Ellery, whose conversation at the Founder's Dinner changed my mind about almost everything."]},
  {id:"bellfellow",kind:"book",where:"tower",title:"Proceedings of the Ashmolean Society, 1888",by:"Various hands",
   when:c=>c.dm.has("A-B"),text:["Dr Bell, newly elected Fellow on the Master's personal recommendation, read a paper on the ventilation of libraries.",
   "He added that he had heard of a Swindon engineer with bold ideas on steam heating, and hoped one day to meet him."]},
  {id:"sermons",kind:"book",where:"div",title:"Sermons Preached in the College Chapel (1889)",by:"Silas Carrow",
   when:c=>c.dm.has("A-C"),text:["Preface: I owe the chaplaincy to the Master, who offered it to me between the soup and the fish at the Founder's Dinner."]},
  {id:"binder",kind:"record",where:"duke",title:"Bodleian staff book, 1888",by:"Bodley's Librarian",
   when:c=>c.dm.has("A-F"),text:["Miss A. Fenwick appointed Senior Binder at the Master's request. He spoke with her at the Founder's Dinner and was much impressed."]},
  {id:"lowe2",kind:"diary",where:"archive",ruin:true,title:"Diary of James Lowe, 14 Nov 1887",by:"James Lowe, undergraduate",
   when:c=>c.dm.has("B-C"),text:["Dr Bell and the Reverend argued about Darwin through three courses. The Reverend called science ‘a sort of engineering of God's furniture’ and said he meant to build some furniture of his own. Bell went quite purple."]},
  {id:"salon",kind:"letter",where:"archive",ruin:true,title:"Letters of Augusta Ellery, I",by:"Augusta Ellery",
   when:c=>c.dm.has("B-E"),text:["Dr Bell came to my Thursday at last. He talks of nothing but air and pipes, poor man, and wants to be introduced to some engineer or other."]},
  {id:"gaslight",kind:"book",where:"rad",title:"On the Effect of Gaslight upon Leather (1891)",by:"A. Fenwick and L. Bell",
   when:c=>c.dm.has("B-F"),text:["We met at the Founder's Dinner, where Miss Fenwick explained why the gas was rotting the Bodleian's bindings. This paper is the result."]},
  {id:"hymns",kind:"book",where:"div",title:"Hymns for Working Men (1890)",by:"S. Carrow, with A. Ellery",
   when:c=>c.dm.has("C-E"),text:["Preface: Mrs Ellery would introduce me to every engineer in England if she could. I have asked her particularly to find me one who understands furnaces."]},
  {id:"notebooks",kind:"book",where:"duke",title:"Notebooks of the Rev. S. Carrow, bound 1888",by:"Bound by A. Fenwick",
   when:c=>c.dm.has("C-F"),text:["Miss Fenwick bound these at Mr Carrow's request after they spoke at dinner. Most pages hold drawings of furnaces, fans and a ‘great consuming engine’.",
   "A note in the margin: ‘It wants a practical man. A railway man?’"]},
  {id:"fountain",kind:"letter",where:"archive",ruin:true,title:"Letters of Augusta Ellery, II",by:"Augusta Ellery",
   when:c=>c.dm.has("D-E"),text:["Mr Dunmore has built me a steam fountain for the garden. A sweet man. He asks me to find him a clergyman with ideas, of all things."]},
  {id:"treatise",kind:"book",where:"duke",title:"A Treatise on Bookbinding (1893)",by:"Ada Fenwick",
   when:c=>c.dm.has("D-F"),text:["Acknowledgements: To Mr Walter Dunmore, my neighbour at the Founder's Dinner, who built me a press so gentle it never cracked a spine. The only engine I have ever trusted near a book."]},
  {id:"lowe3",kind:"diary",where:"archive",ruin:true,title:"Diary of James Lowe, spring 1888",by:"James Lowe, undergraduate",
   when:c=>c.bathOpen,text:["The Reverend Carrow has gone off to the British Association meeting at Bath. That engineer of the Master's, Dunmore, is giving a paper there too.",
   "Odd. They never spoke a word to each other at the Founder's Dinner."]},

  // ---- Bath pairs ----
  {id:"kitty",kind:"letter",where:"archive",ruin:true,title:"Letter from Kitty Ellery, Bath, Sept 1888",by:"Kitty Ellery, Mrs Ellery's niece",
   when:c=>c.bm.has("C-D"),text:["The clergyman from Oxford sat in the very front row for Mr Dunmore's engine, and afterwards they went off arm in arm, talking of ‘the consumption of paper’. I thought it a joke."]},
  {id:"divfall",kind:"report",where:"archive",ruin:false,title:"The Divinity School Disaster, 1896",by:"Curators of the Bodleian",

function face(tx,ty){const dx=tx-player.x,dy=ty-player.y; player.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");}

function update(dt){

// ===== Interaction =====
const INTERACTIVE=new Set(["S","B","L","T","c","C","K","P","~"]);
function interactiveAt(x,y){return !!npcAt(x,y)||INTERACTIVE.has(tileAt(x,y));}
function target(){
  const [dx,dy]=DIRS[player.dir]; const f={x:player.x+dx,y:player.y+dy};
  if(interactiveAt(f.x,f.y)) return f;
  for(const [ax,ay] of Object.values(DIRS)){const x=player.x+ax,y=player.y+ay; if(npcAt(x,y)) return {x,y};}
  for(const [ax,ay] of Object.values(DIRS)){const x=player.x+ax,y=player.y+ay; if(interactiveAt(x,y)) return {x,y};}

}
function describe(t){
  if(!t) return null;
  const n=npcAt(t.x,t.y); if(n) return "Talk to "+n.name.split(",")[0];
  const ch=tileAt(t.x,t.y), reg=regionAt(t.x,t.y);
  const era=S.era;
  if(era==="present"){
    if(ch==="L") return "Read the fragment";
    if(ch==="B") return "Search the archive boxes";
    if(ch==="S") return "Look at the shelves";
    if(ch==="T") return "Look at the desk";
  }
  if(era==="college"){
    if(ch==="T"&&reg&&reg.id==="hall"||ch==="c") return "Lay the place cards";
    if(ch==="C") return "Wind the clock (go home)";
    if(ch==="P") return "Look at the portrait";
    if(ch==="K") return reg&&reg.id==="kitchen"?"Look at the range":"Look at the fire";
    if(ch==="T") return "Look at the table";
  }
  if(era==="bath"){
    if(ch==="T"&&reg&&reg.id==="office") return "Write the programme";
    if(ch==="C") return "Wind the clock (go home)";
    if(ch==="~") return "Look at the spring";
    if(ch==="L") return "Look at the lectern";
    if(ch==="c") return "Look at the chairs";
    if(ch==="T") return "Look at the table";
  }
  return "Look";
}
function interact(){
  const t=target(); if(!t) return;
  face(t.x,t.y);
  const n=npcAt(t.x,t.y); if(n){openDialog(n.name.split(",")[0],n.talk());return;}
  const ch=tileAt(t.x,t.y), reg=regionAt(t.x,t.y), sm=sim();
  if(S.era==="present"){
    if(ch==="L") return openTravel();
    if(ch==="B") return openShelf("archive");
    if(ch==="S"&&reg) return openShelf(reg.id);
    if(ch==="T") return openDialog("",[sm.engine||sm.lost.has("clar")?"A reading desk, split by the heat.":"A reading desk. Someone has left a pencil and a ticket for the Radcliffe Camera."]);
  }
  if(S.era==="college"){
    if((ch==="T"&&reg&&reg.id==="hall")||ch==="c") return openDinner();
    if(ch==="C") return goHome();
    if(ch==="P") return openDialog("",[["The Founder, 1587, looking as if he disapproves of soup.","A former Master. The painter has given him three hands, and nobody has mentioned it.","Bishop Somebody. The plaque has worn away.","A portrait of a dog, given a Fellowship in 1702 as a joke that was never undone."][Math.floor(t.x/4)%4]]);
    if(ch==="K") return openDialog("",[reg&&reg.id==="kitchen"?"The kitchen range, roaring. Turbot for twelve is steaming on top.":"A fire in the grate. Someone has tucked a page of the Times behind the coal scuttle."]);
    if(ch==="T") return openDialog("",["A side table with decanters of port and a bowl of walnuts."]);
  }
  if(S.era==="bath"){
    if(ch==="T"&&reg&&reg.id==="office") return openBath();
    if(ch==="C") return goHome();
    if(ch==="~") return openDialog("",["The hot spring. The water tastes of warm pennies, and the Pump Room smells of eggs. People come here to meet each other and pretend it's for their health."]);
    if(ch==="L") return openDialog("",["The speaker's lectern."]);
    if(ch==="c") return openDialog("",["Gilt chairs, set out in rows for the talks."]);
    if(ch==="T") return openDialog("",["A table of programmes from last year. Nobody has taken one."]);
  }
}

  openSheet(`<div class="head"><div><span class="label">${roomId==="archive"?"Private papers. These survive whatever happens to the library.":"Shelves"}</span><h2>${esc(name)}</h2></div><button class="x">Close</button></div>
    <div class="shelf">${lost?`<p class="ashes">${sm.engine?"Nothing here but scorched stone and the smell of smoke.":"The building is in ruins. Whatever was shelved here is lost."}</p>`:
    items.length?items.map(it=>`<button class="book k-${it.kind}${S.read[it.id]?" read":""}" data-item="${it.id}"><span class="spine"></span><span><span class="t">${esc(it.title)}</span>${isNew(it)?`<span class="new">new</span>`:""}<br><span class="m">${esc(it.by)}</span></span></button>`).join(""):
    `<p class="empty">Nothing on these shelves bears on your problem.</p>`}</div>`,
  sc=>{sc.querySelector(".x").onclick=()=>closeSheet();
    sc.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>openBook(b.dataset.item,()=>openShelf(roomId)));});
}
function openBook(id,back){
  const it=ITEMS.find(i=>i.id===id); if(!it) return; S.read[id]=true;
  const sm=sim(); const paras=it.dyn?it.dyn({dm:sm.dm,bm:sm.bm,bathOpen:sm.bathOpen}):it.text;
  openSheet(`<div class="page" role="dialog" aria-modal="true"><h3>${esc(it.title)}</h3><span class="by">${esc(it.by)}</span>${paras.map(p=>`<p>${esc(p)}</p>`).join("")}<button class="close">Put it back</button></div>`,
    sc=>{sc.querySelector(".close").onclick=()=>back?back():closeSheet();},"page");
}
function openTravel(){
  const sm=sim(), fr=fragmentText(sm,false);
  openSheet(`<div class="head"><div><span class="label">On the lectern</span><h2>The fragment</h2></div><button class="x">Close</button></div>
    <div class="fragment">${fr.html}</div>
    <p class="muted">Hold the page and think hard about a moment in its past, and the quadrangle starts to blur.</p>
    <div class="travel">
      <button class="trip" id="toDinner"><span class="yr">1887</span><h3>The Founder's Dinner</h3><span class="role">You'll be kitchen staff. You lay the place cards.</span>
        <span class="flag ${sm.dm.has("C-D")?"bad":"ok"}">${S.trips?(sm.dm.has("C-D")?"Mr A and Mr B still meet here":"Mr A and Mr B no longer meet here"):"Where it began"}</span></button>
      <button class="trip" id="toBath" ${S.bathKnown?"":"disabled"}><span class="yr">1888</span><h3>British Association, Bath</h3><span class="role">${S.bathKnown?"You'll be the programme clerk. You set the timetable.":"You have no reason to go here yet."}</span>
        ${S.bathKnown?`<span class="flag ${sm.engine==="bath"?"bad":(sm.bathOpen?"ok":"")}">${!sm.bathOpen?"Not reached in this timeline":sm.engine==="bath"?"Mr A and Mr B meet here":"Mr A and Mr B do not meet here"}</span>`:""}</button>
    </div>`,
  sc=>{sc.querySelector(".x").onclick=()=>closeSheet();
    sc.querySelector("#toDinner").onclick=()=>travel("college");
    if(S.bathKnown) sc.querySelector("#toBath").onclick=()=>travel("bath");});
}
function travel(era){
  closeSheet(true);
  if(era==="college") S.draftSeats=S.seats.slice();
  if(era==="bath") S.draftSched=S.sched.slice();
  S.era=era; S.pos[era]={...SPAWN[era],dir:"down"}; ui.dialog=null;
  render();
  openDialog("",era==="college"?["The quadrangle dissolves into steam and the smell of roasting meat. You're in an apron, in a college kitchen, in 1887.","The guests are gathering in the Senior Common Room. You could listen in before you lay the table."]:
    ["Bath, September 1888. Ink on your fingers, a stack of letters from speakers on your desk.","The programme isn't printed yet. You could find the speakers first and hear what they want."]);
}
function goHome(){
  openSheet(`<div class="head"><h2>Go home?</h2><button class="x">Stay</button></div><p>If you wind the clock now you'll return to the present and leave this evening exactly as it was.</p>
    <div class="row"><button class="btn" id="home">Return to the present</button></div>`,
  sc=>{sc.querySelector(".x").onclick=()=>closeSheet(); sc.querySelector("#home").onclick=()=>{closeSheet(true);S.era="present";S.pos.present={...SPAWN.present,dir:"up"};render();};});
}

// ----- dinner planner -----
function openDinner(){
  const d=S.draftSeats||(S.draftSeats=S.seats.slice()), m=dinnerMeet(d);
  openSheet(`<div class="head"><div><span class="label">The Master's table</span><h2>Place cards</h2></div><button class="x">Back to the kitchen</button></div>
    <div class="rules"><div class="rule"><b>The Master</b> takes the first place at the head.</div><div class="rule"><b>Conversation</b> only happens between neighbours.</div><div class="rule"><b>Mrs Ellery</b> introduces whoever sits on her left to whoever sits on her right.</div></div>
    <p class="muted">Tap a card, then another, to swap them.</p>
    <div class="table">${d.map((p,i)=>`<button class="seat${i===0?" fixed":""}${ui.sel===i?" sel":""}" data-seat="${i}" ${i===0?'aria-disabled="true"':""}><span class="no">Place ${i+1}</span><span class="nm">${esc(P[p].name)}</span><span class="ds">${esc(P[p].desc)}</span></button>`).join("")}</div>
    <div><span class="label">Who will talk to whom tonight</span><div class="talks" style="margin-top:6px">${[...m.entries()].map(([k,how])=>{const [a,b]=k.split("-");return `<span class="chip${how.startsWith("intro")?" intro":""}">${esc(P[a].name)} & ${esc(P[b].name)}${how.startsWith("intro")?" (introduced)":""}</span>`;}).join("")}</div></div>
    <div class="row"><button class="btn" id="serve">Serve dinner</button><button class="btn ghost" id="hist">Reset to the original seating</button></div>`,
  sc=>{
    sc.querySelector(".x").onclick=()=>{ui.sel=null;closeSheet();};
    sc.querySelectorAll("[data-seat]").forEach(el=>el.onclick=()=>{const i=+el.dataset.seat; if(i===0) return;
      if(ui.sel==null) ui.sel=i; else if(ui.sel===i) ui.sel=null; else {const t=d[i];d[i]=d[ui.sel];d[ui.sel]=t;ui.sel=null;} openDinner();});
    sc.querySelector("#hist").onclick=()=>{S.draftSeats=HIST_SEATS.slice();ui.sel=null;openDinner();};
    sc.querySelector("#serve").onclick=()=>{
      const evs=[...m.entries()].map(([k,how])=>{const [a,b]=k.split("-");
        return how.startsWith("intro")?`Mrs Ellery leans across: “${P[a].name}, you simply must know ${P[b].name}.” They talk until the port.`:`${P[a].name} and ${P[b].name} talk across the turbot.`;});
      commitTrip("Dinner: "+d.map(p=>P[p].name.split(" ").pop()).join(", "),()=>{S.seats=d.slice();},"The soup goes up. You watch from the servery door.",evs);
    };
  });
}

// ----- Bath planner -----
function bathProblems(c){const out=[];
  if(c.indexOf("Q")>1) out.push("Miss Quill must speak in the morning. She has a noon train to catch for her dig.");
  if(c.indexOf("D")%2!==0) out.push("Mr Dunmore's engine only fits in the Ball Room.");
  return out;}
function openBath(){
  const c=S.draftSched||(S.draftSched=S.sched.slice()), probs=bathProblems(c), r=bathMeet(c);
  const cell=i=>`<button class="cell${ui.sel===i?" sel":""}" data-cell="${i}"><span>${esc(P[c[i]].name)}</span><span class="tk">${esc(P[c[i]].talk)}</span></button>`;
  openSheet(`<div class="head"><div><span class="label">The clerk's desk</span><h2>The programme</h2></div><button class="x">Leave the desk</button></div>
    <div class="rules"><div class="rule"><b>Speakers</b> can't attend another talk in their own session.</div><div class="rule"><b>When free</b>, each speaker goes to a talk they're keen on. If keen on both, they choose the bigger <b>Ball Room</b>.</div><div class="rule"><b>If keen on neither</b>, they go to the <b>Pump Room</b>, and everyone there meets.</div></div>
    <p class="muted">Tap a talk, then another, to swap them.</p>
    <div style="overflow-x:auto"><div class="prog"><span></span><span class="h">Ball Room</span><span class="h">Octagon</span>${SESS.map((s,i)=>`<span class="sess">${s}</span>${cell(2*i)}${cell(2*i+1)}`).join("")}</div></div>
    ${probs.map(p=>`<p class="warn">${esc(p)}</p>`).join("")}
    <div><span class="label">Speakers' letters on your desk</span><div class="letters" style="margin-top:6px">${Object.keys(KEEN).map(x=>`<div class="letter"><span class="who">${esc(P[x].name)}, ${esc(P[x].desc)}</span><br>I very much hope to hear ${KEEN[x].map(y=>esc(P[y].name)).join(" and ")}.</div>`).join("")}</div></div>
    <div><span class="label">Who will meet whom</span><div class="talks" style="margin-top:6px">${[...r.m.entries()].map(([k,how])=>{const [a,b]=k.split("-");return `<span class="chip${how.startsWith("Pump")?" intro":""}">${esc(P[a].name)} & ${esc(P[b].name)} (${esc(how)})</span>`;}).join("")}</div></div>
    <div class="row"><button class="btn" id="print" ${probs.length?"disabled":""}>Send the programme to the printer</button><button class="btn ghost" id="hist">Reset to the original programme</button></div>`,
  sc=>{
    sc.querySelector(".x").onclick=()=>{ui.sel=null;closeSheet();};
    sc.querySelectorAll("[data-cell]").forEach(el=>el.onclick=()=>{const i=+el.dataset.cell;
      if(ui.sel==null) ui.sel=i; else if(ui.sel===i) ui.sel=null; else {const t=c[i];c[i]=c[ui.sel];c[ui.sel]=t;ui.sel=null;} openBath();});
    sc.querySelector("#hist").onclick=()=>{S.draftSched=HIST_SCHED.slice();ui.sel=null;openBath();};
    const pr=sc.querySelector("#print"); if(!probs.length) pr.onclick=()=>{
      const evs=r.where.map((w,i)=>{const parts=[`${SESS[i]}: ${P[w.ball].name} in the Ball Room, ${P[w.oct].name} in the Octagon.`];
        if(w.toBall.length) parts.push(`${w.toBall.map(x=>P[x].name).join(", ")} ${w.toBall.length>1?"crowd":"crowds"} into the Ball Room.`);
        if(w.toOct.length) parts.push(`${w.toOct.map(x=>P[x].name).join(", ")} ${w.toOct.length>1?"slip":"slips"} into the Octagon.`);
        if(w.pump.length) parts.push(`${w.pump.map(x=>P[x].name).join(", ")} ${w.pump.length>1?"take":"takes"} the waters at the Pump Room.`);
        return parts.join(" ");});
      commitTrip("Bath: "+SESS.map((s,i)=>s[0]+" "+P[c[2*i]].name.split(" ").pop()+"/"+P[c[2*i+1]].name.split(" ").pop()).join(", "),()=>{S.sched=c.slice();},"The programme is printed. You spend the meeting at the clerk's desk, watching.",evs);
    };
  });
}

function commitTrip(label,apply,opening,evs){
  S.prevVisible=visible(sim()).map(i=>i.id);
  apply(); S.trips++; S.hint=0; ui.sel=null;
  const sm=sim();
  S.log.push({label,seats:S.seats.slice(),sched:S.sched.slice(),engine:sm.engine,standing:sm.engine?0:ROOMS.length-sm.lost.size});
  openSheet(`<div class="interlude"><span class="label">The past</span><p>${esc(opening)}</p>${evs.map(e=>`<p class="ev">${esc(e)}</p>`).join("")}
    <p class="muted">Then the lamps gutter, the room tilts, and you are standing beside the lectern in the Old Schools Quadrangle again.</p>
    <div class="row"><button class="btn" id="ret">See what the present has become</button></div></div>`,
  sc=>sc.querySelector("#ret").onclick=()=>{
    closeSheet(true); S.era="present"; S.pos.present={...SPAWN.present,dir:"up"}; render();
    const s2=sim(); if(!s2.engine&&s2.lost.size===0) openWin();
  });
}
function openWin(){
  openSheet(`<div class="head"><div><span class="label">The present · after ${S.trips} trips</span><h2>The library stands</h2></div><button class="x">Walk the shelves</button></div>
    <p class="lede" style="font-family:var(--f-book);font-size:1.15rem">Rev. Carrow and Mr Dunmore never met. The Radcliffe Camera, Duke Humfrey's Library, the Divinity School, the Old Schools Quadrangle and the Clarendon Building are all where they should be, full of books that some of them would never have been written without you.</p>
    <p class="muted">This is the end of chapter one. The story of Mr A and Mr B is a placeholder for now.</p>
    <div class="row"><button class="btn ghost" id="again">Play again from the ruins</button></div>`,
  sc=>{sc.querySelector(".x").onclick=()=>closeSheet(); sc.querySelector("#again").onclick=()=>{closeSheet(true);S=fresh();S.screen="world";render();};});
}
function openCasebook(){
  const sm=sim(), hints=hintsFor(sm);
  openSheet(`<div class="head"><div><span class="label">Everything you have learned</span><h2>Casebook</h2></div><button class="x">Close</button></div>
    <p class="muted">Every timeline you've made. Restoring one puts the past back the way it was on that trip. You'll find yourself back at the lectern.</p>
    <div class="log">${S.log.length?S.log.map((l,i)=>`<div class="entry"><span class="n">${i+1}</span><span class="what">${esc(l.label)} <span class="muted">· ${l.engine?"library destroyed":l.standing+"/"+ROOMS.length+" standing"}</span></span><button data-restore="${i}">Restore</button></div>`).join(""):`<p class="empty">No trips yet.</p>`}</div>
    <label class="label" for="notes">Your notes</label>
    <textarea id="notes" placeholder="Who is Mr A? Who is Mr B? Which pairs are dangerous?">${esc(S.notes)}</textarea>
    <p class="muted">Stuck? Find Miss Harker, the archivist, in the College Archive in the present.</p>
    <div class="row"><button class="btn ghost small" id="title">Title screen</button></div>`,
  sc=>{
    sc.querySelector(".x").onclick=()=>closeSheet();
    const n=sc.querySelector("#notes"); n.oninput=()=>{S.notes=n.value;save();};
    sc.querySelector("#title").onclick=()=>{closeSheet(true);S.screen="title";render();};
    sc.querySelectorAll("[data-restore]").forEach(el=>el.onclick=()=>{
      const l=S.log[+el.dataset.restore]; S.prevVisible=visible(sim()).map(i=>i.id);
      S.seats=l.seats.slice(); S.sched=l.sched.slice(); S.hint=0;
      S.log.push(Object.assign({},l,{label:"Restored timeline "+(+el.dataset.restore+1)}));
      closeSheet(true); S.era="present"; S.pos.present={...SPAWN.present,dir:"up"}; render();
    });
  });
}

window.__game={get S(){return S;},interact,openDinner,openBath,travel,
  teleport(x,y,dir){player.x=player.fx=x;player.y=player.fy=y;player.dir=dir||player.dir;path=[];}};
render();
})();
</script>
